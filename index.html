<script>

let lang = "en", filter = "all";

const grid = document.getElementById("movieGrid");

const input = document.getElementById("searchInput");

const emptyMsg = document.getElementById("emptyMsg");

let titles = [];

let requestId = 0;

function t(en, ku) {

  return lang === "en" ? en : ku;

}

async function loadTitles(query = "") {

  const id = ++requestId;

  grid.innerHTML = "";

  emptyMsg.style.display = "block";

  emptyMsg.textContent = t("Loading titles...", "چاوەڕێ بکە...");

  

  try {

    let shows = [];

    if (query.trim()) {

      const res = await fetch(

        "https://api.tvmaze.com/search/shows?q=" +

        encodeURIComponent(query.trim())

      );

      if (!res.ok) throw new Error("Request failed");

      shows = (await res.json()).map(item => item.show);

    } else {

      const res = await fetch("https://api.tvmaze.com/shows?page=0");

      if (!res.ok) throw new Error("Request failed");

      shows = await res.json();

    }

    if (id !== requestId) return;

    titles = shows.map(show => ({

      name: show.name || "Untitled",

      year: show.premiered ? show.premiered.slice(0, 4) : "—",

      rate: show.rating?.average ?? "—",

      type: "series",

      genre: show.genres?.[0] || "TV",

      poster: show.image?.medium || show.image?.original || "",

      summary: show.summary || ""

    }));

    render();

  } catch (error) {

    if (id !== requestId) return;

    emptyMsg.style.display = "block";

    emptyMsg.textContent = t(

      "Could not load titles. Check your internet and try again.",

      "نەتوانرا زانیارییەکان بهێنرێن. ئینتەرنێتەکەت بپشکنە و دووبارە هەوڵ بدەرەوە."

    );

  }

}

function render() {

  const q = input.value.trim().toLowerCase();

  const found = titles.filter(x =>

    (filter === "all" || filter === x.type) &&

    (x.name.toLowerCase().includes(q) ||

     x.genre.toLowerCase().includes(q) ||

     String(x.year).includes(q))

  );

  grid.innerHTML = found.map((x, i) => `

    <article class="card" tabindex="0" data-index="${i}">

      <div class="poster" style="--c1:#27242b;${x.poster ? `background-image:linear-gradient(0deg,#09090b99,transparent),url('${x.poster}');background-size:cover;background-position:center` : ""}" data-symbol="✦">

        <span class="rating">★ ${x.rate}</span>

        <span class="poster-label">${t("SERIES", "زنجیرە")}</span>

      </div>

      <div class="card-info">

        <h3>${escapeHTML(x.name)}</h3>

        <div class="meta"><span>${x.year}</span><span class="type">${escapeHTML(x.genre)}</span></div>

      </div>

    </article>

  `).join("");

  emptyMsg.style.display = found.length ? "none" : "block";

  if (!found.length) emptyMsg.textContent = t("No titles found.", "هیچ زنجیرەیەک نەدۆزرایەوە.");

}

function escapeHTML(value) {

  return String(value).replace(/[&<>"']/g, c => ({

    "&": "&amp;", "<": "&lt;", ">": "&gt;",

    '"': "&quot;", "'": "&#39;"

  }[c]));

}

function setLanguage(next) {

  lang = next;

  document.body.classList.toggle("kurdish", lang === "ku");

  document.documentElement.lang = lang === "ku" ? "ckb" : "en";

  document.documentElement.dir = lang === "ku" ? "rtl" : "ltr";

  document.querySelectorAll("[data-en]").forEach(el => {

    el.innerHTML = el.dataset[lang];

  });

  document.getElementById("langBtn").textContent =

    lang === "en" ? "کوردی" : "English";

  input.placeholder = t("Search TV series...", "بگەڕێ بۆ زنجیرە...");

  render();

}

document.getElementById("langBtn").addEventListener("click", () => {

  setLanguage(lang === "en" ? "ku" : "en");

});

document.getElementById("searchBtn").addEventListener("click", () => {

  loadTitles(input.value);

});

input.addEventListener("keydown", e => {

  if (e.key === "Enter") loadTitles(input.value);

});

document.querySelectorAll(".filter").forEach(btn => {

  btn.addEventListener("click", () => {

    filter = btn.dataset.filter;

    document.querySelectorAll(".filter").forEach(b =>

      b.classList.toggle("active", b === btn)

    );

    render();

  });

});

document.getElementById("homeBtn").addEventListener("click", () => {

  input.value = "";

  filter = "all";

  document.querySelectorAll(".filter").forEach(b =>

    b.classList.toggle("active", b.dataset.filter === "all")

  );

  loadTitles();

  window.scrollTo({ top: 0, behavior: "smooth" });

});

document.getElementById("year").textContent = new Date().getFullYear();

loadTitles();

</script>
